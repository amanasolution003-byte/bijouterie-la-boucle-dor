# ============================================
# Configuration Decap CMS - La Boucle d'Or
# Edite le contenu du site : textes, collections,
# produits, avis, coordonnees.
# ============================================

backend:
  name: github
  repo: amanasolution003-byte/bijouterie-la-boucle-dor
  branch: main
  base_url: https://decap-oauth.amana-solution003.workers.dev
  auth_endpoint: /auth

# Les images ajoutees via l'editeur sont stockees ici
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # ---------- Textes generaux du site ----------
  - name: "settings"
    label: "Parametres du site"
    label_singular: "Parametre"
    description: "Textes principaux : hero, histoire, avis, contact, pied de page."
    format: json
    files:
      - name: "settings"
        label: "Textes du site"
        file: "content/settings.json"
        fields:
          - label: "Site"
            name: "site"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titre (onglet navigateur)", name: "title", widget: "string" }
              - { label: "Logo (texte en haut a gauche)", name: "logo", widget: "string" }
              - { label: "Pied de page", name: "footer", widget: "string" }
          - label: "Hero (image d'accueil)"
            name: "hero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "string" }
              - { label: "Texte du bouton", name: "button", widget: "string" }
              - { label: "Image de fond", name: "image", widget: "image" }
          - label: "Section Collections"
            name: "collections"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "string" }
          - label: "Notre Histoire"
            name: "about"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "string" }
              - label: "Paragraphes"
                name: "paragraphs"
                widget: "list"
                field: { label: "Paragraphe", name: "par", widget: "text" }
              - { label: "Texte du bouton", name: "button", widget: "string" }
              - { label: "Lien du bouton", name: "buttonLink", widget: "string" }
          - label: "Avis clients"
            name: "testimonials"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "string" }
              - label: "Avis"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Texte de l'avis", name: "text", widget: "text" }
                  - { label: "Auteur", name: "author", widget: "string" }
          - label: "Contact"
            name: "contact"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "string" }
              - label: "Coordonnees"
                name: "items"
                widget: "list"
                fields:
                  - label: "Type d'icone"
                    name: "icon"
                    widget: "select"
                    options:
                      - { label: "Telephone", value: "phone" }
                      - { label: "WhatsApp", value: "whatsapp" }
                      - { label: "Facebook", value: "facebook" }
                      - { label: "Email", value: "email" }
                      - { label: "Horaires", value: "hours" }
                      - { label: "Adresse", value: "address" }
                  - { label: "Libelle (Telephone, Email...)", name: "label", widget: "string" }
                  - { label: "Valeur affichee", name: "value", widget: "string" }
                  - { label: "Lien (tel:, mailto:, ou URL)", name: "link", widget: "string", required: false }

  # ---------- Collections de la page d'accueil ----------
  - name: "collections"
    label: "Collections (page d'accueil)"
    label_singular: "Collection"
    description: "Les 7 grandes categories affichees sur la page d'accueil. Pour une nouvelle collection, mettez dans 'Page associee' un simple mot-clef (ex: diamant) : la page se cree automatiquement."
    format: json
    files:
      - name: "lists"
        label: "Liste des collections"
        file: "content/collections.json"
        fields:
          - label: "Collections"
            name: "items"
            widget: "list"
            fields:
              - { label: "Nom (Bague, Bracelet...)", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Image", name: "image", widget: "image" }
              - label: "Format de la photo"
                name: "imageFormat"
                widget: "select"
                default: "cover"
                options:
                  - { label: "Remplir (rogne les bords)", value: "cover" }
                  - { label: "Montrer en entier (sans rogner)", value: "contain" }
              - label: "Taille de la photo"
                name: "imageSize"
                widget: "select"
                default: "medium"
                options:
                  - { label: "Petite (200px)", value: "small" }
                  - { label: "Moyenne (250px)", value: "medium" }
                  - { label: "Grande (320px)", value: "large" }
                  - { label: "Taille d'origine (hauteur auto)", value: "auto" }
              - label: "Page associee"
                name: "page"
                widget: "string"
                hint: "Chemin complet (pages/bague.html) OU un simple mot-clef (ex: diamant) pour creer la page automatiquement."

  # ---------- Produits par categorie ----------
  - name: "products"
    label: "Produits"
    label_singular: "Categorie de produits"
    description: "Modifiez les produits de chaque categorie. Pour une nouvelle collection : creez une categorie et mettez comme 'Mot-clef' exactement le meme mot-clef que la collection de la page d'accueil."
    format: json
    folder: "content/products"
    create: true
    identifier_field: "slug"
    fields:
      - label: "Mot-clef de la categorie"
        name: "slug"
        widget: "string"
        hint: "Exactement le meme mot-clef que la collection de l'accueil (ex: diamant). Sans accents ni espaces."
      - { label: "Titre de la page", name: "pageTitle", widget: "string" }
      - { label: "Sous-titre de la page", name: "subtitle", widget: "string" }
      - label: "Produits"
        name: "products"
        widget: "list"
        fields:
          - { label: "Nom du produit", name: "title", widget: "string" }
          - { label: "Image", name: "image", widget: "image" }
          - label: "Format de la photo"
            name: "imageFormat"
            widget: "select"
            default: "cover"
            options:
              - { label: "Remplir (rogne les bords)", value: "cover" }
              - { label: "Montrer en entier (sans rogner)", value: "contain" }
          - label: "Taille de la photo"
            name: "imageSize"
            widget: "select"
            default: "medium"
            options:
              - { label: "Petite (220px)", value: "small" }
              - { label: "Moyenne (350px)", value: "medium" }
              - { label: "Grande (480px)", value: "large" }
              - { label: "Taille d'origine (hauteur auto)", value: "auto" }